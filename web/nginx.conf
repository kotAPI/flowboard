# The SPA and the API share one origin: /v1/* is proxied to the api service (a thin BFF/gateway
# seam; in production this is where TLS, rate limits and auth-session handling would live).
server {
  listen 80;
  root /usr/share/nginx/html;

  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health { proxy_pass http://api:3000/health; }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
